{% set name = "catppuccin-jupyterlab" %}
{% set version = "0.2.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/catppuccin_jupyterlab-{{ version }}.tar.gz
  sha256: 534f61026e741511542cf0b59893778e25ca0845db517afa2d7802136d5e8f9b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.5.0
    - jupyterlab >=3.0.0,<5
    - hatch-nodejs-version
    - pip
    - hatch-jupyter-builder >=0.5
  run:
    - python >={{ python_min }}

test:
  imports:
    - catppuccin_jupyterlab
  commands:
    - pip check
    - jupyter labextension list
    - jupyter labextension list 2>&1 | grep -ie "catppuccin_jupyterlab.*OK"  # [not win]
    - python -m jupyterlab.browser_check --no-browser-test
  requires:
    - pip
    - jupyterlab
    - grep  # [not win]
    - python {{ python_min }}

about:
  summary: 📊 Soothing pastel theme for JupyterLab.
  license: MIT
  license_file: LICENSE
  home: https://github.com/catppuccin/jupyterlab

extra:
  recipe-maintainers:
    - xDazld
